[project]
name = "reel-agent-tts"
version = "0.1.0"
description = "Chatterbox TTS service for reel-social-agent: per-beat synthesis with forced-alignment word timings"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chatterbox-tts",
    "fastapi>=0.129",
    "uvicorn>=0.40",
    "python-dotenv>=1.2",
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
]

[tool.uv.sources]
chatterbox-tts = { path = "./chatterbox", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
